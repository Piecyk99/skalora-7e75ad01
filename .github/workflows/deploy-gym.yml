name: Deploy gym (gym.skalora.pl)

on:
  push:
    branches: [main, ccr-43c6de05-h649jb]
    paths:
      - 'gym-app/**'
      - '.github/workflows/deploy-gym.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy gym Worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: gym-app
        run: npm ci
      - name: Deploy with wrangler
        working-directory: gym-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "75bcda4af452221f9e0b085605e562ef"
        run: npx wrangler deploy
