name: Deploy cockpit to GitHub Pages

# Buduje cockpit DP DYNEX (podfolder cockpit/) i publikuje na GitHub Pages.
# Klucz VITE_SUPABASE_ANON_KEY jest PUBLISHABLE (publiczny — i tak ląduje w bundlu),
# więc trzymany wprost; dane chroni RLS. URL bazy też jest publiczny.

on:
  push:
    branches: [main, claude/crm-erp-architecture-review-d1blhe]
    paths: ["cockpit/**", ".github/workflows/deploy-cockpit-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cockpit
    env:
      VITE_SUPABASE_URL: https://meactqtvjiztahuzgxqp.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_AoevzeKtZn-UIo8LSUSMBA_O6aBpPO-
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - run: npm ci
      # base = /<repo>/ bo to projekt GitHub Pages (nie domena root)
      - run: npm run build -- --base=/skalora-7e75ad01/
      # SPA fallback: każde nieznane wejście serwuje aplikację
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cockpit/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
