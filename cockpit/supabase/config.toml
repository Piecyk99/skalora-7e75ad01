# Agent-szukacz: web search Claude -> prospects. verify_jwt=true (staff/cron w funkcji).
[functions.lead-finder]
verify_jwt = true

# Agent-copywriter (Faza 3b). verify_jwt=true. Generuje drafty, NIE wysyła.
[functions.copywriter]
verify_jwt = true

# Wysyłka outreach (approve -> sent). verify_jwt=true.
[functions.send-outreach]
verify_jwt = true

# Tracking otwarć/kliknięć — wołane przez klienty pocztowe, BEZ JWT.
[functions.track-open]
verify_jwt = false

[functions.track-click]
verify_jwt = false

# Webhook Resend (bounced/complained/delivered...). verify_jwt=false — uwierzytelnia
# się podpisem Svix wewnątrz funkcji (sekret RESEND_WEBHOOK_SECRET w Vault).
[functions.resend-webhook]
