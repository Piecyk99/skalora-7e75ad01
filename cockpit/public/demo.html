<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skalora — CRM / ERP (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#040814; --card:#0e1626; --card2:#131f33; --muted:#16233c; --line:#23304a;
    --txt:#eef2f8; --mut:#93a1b8;
    --green:#10b981; --red:#ef4444; --amber:#f59e0b; --blue:#3b82f6; --violet:#8b5cf6; --orange:#fb923c; --cyan:#22d3ee;
    --r:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
    radial-gradient(1100px 500px at 80% -10%,rgba(16,185,129,.08),transparent 60%),
    radial-gradient(900px 500px at 0% 0%,rgba(59,130,246,.06),transparent 55%),
    var(--bg);
    color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.head{font-family:'Space Grotesk','Plus Jakarta Sans',sans-serif}
  .topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(8,13,26,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .menu{width:34px;height:34px;border:1px solid var(--line);background:var(--muted);border-radius:10px;color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .brand{display:flex;align-items:center;gap:10px}
  .blogo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#22d3ee,#3b82f6 45%,#10b981);display:flex;align-items:center;justify-content:center;color:#04130d;font-weight:800;font-size:16px;box-shadow:0 4px 14px rgba(16,185,129,.3)}
  .brand b{font-size:15px;letter-spacing:.06em;font-family:'Space Grotesk'}
  .brand small{display:block;font-size:9px;color:var(--mut);letter-spacing:.22em;margin-top:1px}
  .badges{display:flex;gap:7px;flex-wrap:wrap;margin-left:8px}
  .bdg{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:5px 11px;font-size:12px;font-weight:700}
  .bdg svg{width:13px;height:13px}
  .bdg.red{background:rgba(239,68,68,.13);color:#f87171;border:1px solid rgba(239,68,68,.32)}
  .bdg.amber{background:rgba(245,158,11,.13);color:#fbbf24;border:1px solid rgba(245,158,11,.32)}
  .bdg.orange{background:rgba(251,146,60,.13);color:#fdba74;border:1px solid rgba(251,146,60,.32)}
  .spacer{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mut);font-size:12.5px;min-width:170px}
  .ico{width:34px;height:34px;border:1px solid var(--line);background:var(--muted);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
  .ava{display:flex;align-items:center;gap:8px}
  .ava .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#10b981);display:flex;align-items:center;justify-content:center;color:#04130d;font-weight:800;font-size:12px}
  .ava small{font-size:11px;color:var(--mut)}
  .subnav{display:flex;gap:2px;padding:0 16px;background:rgba(8,13,26,.6);border-bottom:1px solid var(--line);position:sticky;top:55px;z-index:25;overflow-x:auto}
  .subnav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:13px 14px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .subnav button svg{width:16px;height:16px}
  .subnav button:hover{color:var(--txt)}
  .subnav button.on{color:#fff;border-bottom-color:var(--green)}
  .subnav button.on svg{color:var(--green)}
  .wrap{max-width:1260px;margin:0 auto;padding:20px 24px 56px}
  .pagehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .pagehead h1{margin:0;font-size:25px;font-weight:700}
  .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:11px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;color:#fff;transition:.14s}
  .btn:hover{filter:brightness(1.08)}
  .btn svg{width:15px;height:15px}
  .btn.green{background:linear-gradient(135deg,#10b981,#059669);color:#04130d}
  .btn.blue{background:var(--blue)} .btn.violet{background:var(--violet)}
  .btn.ghost{background:var(--muted);color:var(--txt);border:1px solid var(--line)}
  .muted{color:var(--mut)}
  .sec{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:800;margin:26px 2px 11px;display:flex;align-items:center;gap:8px}
  .sec svg{width:15px;height:15px;color:var(--green)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .today{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;background:linear-gradient(135deg,rgba(16,185,129,.07),rgba(59,130,246,.05)),var(--card)}
  .today .l small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:800}
  .today .l p{margin:6px 0 0;font-size:13px;color:var(--mut)}
  .today a{color:var(--green);font-size:13px;text-decoration:none;font-weight:600;white-space:nowrap}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .filters .f{font-size:12px;border:1px solid var(--line);background:var(--muted);color:var(--mut);border-radius:9px;padding:6px 11px;cursor:pointer;font-weight:600}
  .filters .f.on{background:rgba(16,185,129,.15);color:#bff3df;border-color:rgba(16,185,129,.4)}
  .tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  table.t{width:100%;border-collapse:collapse;font-size:12.5px}
  table.t thead{background:var(--muted)}
  table.t th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;padding:11px 10px;text-align:right}
  table.t th.l,table.t td.l{text-align:left}
  table.t td{padding:12px 10px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  table.t tr.click{cursor:pointer}
  table.t tr.click:hover{background:rgba(255,255,255,.03)}
  .uname{font-weight:700;color:var(--txt)}
  .role{color:var(--mut)}
  .score{font-weight:800;color:var(--green);font-family:'Space Grotesk'}
  .st{font-size:10px;padding:3px 9px;border-radius:999px;border:1px solid;font-weight:700;white-space:nowrap}
  .st.act{border-color:rgba(16,185,129,.4);color:#6ee7b7}.st.over{border-color:rgba(245,158,11,.4);color:#fcd34d}
  .st.no{border-color:var(--line);color:var(--mut)}.st.blue{border-color:rgba(59,130,246,.4);color:#93c5fd}
  tr.inactive{opacity:.5}
  .grid{display:grid;gap:11px}
  .g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
  .kpi{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;transition:.14s}
  .kpi:hover{transform:translateY(-2px)}
  .kpi .kh{display:flex;align-items:center;gap:7px;margin-bottom:8px}
  .kpi .kh svg{width:16px;height:16px}
  .kpi .kl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700}
  .kpi .kv{font-family:'Space Grotesk';font-weight:700;font-size:31px;line-height:1}
  .kpi.red{border-color:var(--red);background:linear-gradient(180deg,rgba(239,68,68,.08),transparent);box-shadow:0 10px 26px rgba(239,68,68,.13)} .kpi.red .kv,.kpi.red svg{color:#f87171}
  .kpi.amber{border-color:var(--amber);background:linear-gradient(180deg,rgba(245,158,11,.08),transparent);box-shadow:0 10px 26px rgba(245,158,11,.12)} .kpi.amber .kv,.kpi.amber svg{color:#fbbf24}
  .kpi.green{box-shadow:0 10px 26px rgba(16,185,129,.10)} .kpi.green .kv,.kpi.green svg{color:var(--green)}
  .kpi.blue .kv,.kpi.blue svg{color:#60a5fa}.kpi.violet .kv,.kpi.violet svg{color:#a78bfa}
  .kpi.neutral .kv{color:var(--txt)} .kpi.neutral svg{color:var(--mut)}
  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;align-items:start}
  .col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:120px}
  .col h3{font-size:11px;margin:4px 6px 10px;color:var(--mut);display:flex;justify-content:space-between;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .col h3 .cnt{background:var(--muted);border-radius:999px;padding:1px 8px;color:var(--txt)}
  .lead{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:8px;cursor:pointer;transition:.12s}
  .lead:hover{border-color:var(--green);transform:translateY(-1px)}
  .lead .nm{font-weight:700;font-size:13px}
  .lead .mt{font-size:11px;color:var(--mut);margin-top:5px;display:flex;justify-content:space-between}
  .lead .mt b{color:var(--green);font-weight:700}
  .stage{display:flex;gap:14px;cursor:pointer}
  .stage .rail{display:flex;flex-direction:column;align-items:center}
  .stage .node{width:27px;height:27px;border-radius:50%;border:2px solid var(--line);background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut);font-weight:700}
  .stage .line{width:2px;flex:1;background:var(--line);min-height:24px}
  .stage.done .node{background:var(--green);border-color:var(--green);color:#04130d}
  .stage.active .node{background:#0a1120;border-color:var(--green);color:var(--green);box-shadow:0 0 0 4px rgba(16,185,129,.2)}
  .stage .body{padding-bottom:20px}.stage .ttl{font-weight:700}.stage:hover .ttl{color:var(--green)}
  .stage .sub{font-size:12px;color:var(--mut);margin-top:2px}
  .progress{height:9px;background:var(--muted);border-radius:999px;overflow:hidden;margin-top:10px}
  .progress>i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#10b981)}
  .offers{grid-template-columns:repeat(3,1fr)}
  .offer{cursor:pointer;transition:.12s;padding:0;overflow:hidden}
  .offer:hover{border-color:var(--green);transform:translateY(-3px)}
  .offer .ph{height:140px;background:linear-gradient(135deg,#0c2a22,#123a4d);display:flex;align-items:center;justify-content:center;color:#7fe3bf;font-weight:700;border-bottom:1px solid var(--line)}
  .offer .ob{padding:15px}.offer .nm{font-weight:700;font-family:'Space Grotesk'}
  .offer .pr{color:var(--green);font-weight:800;margin-top:6px;font-family:'Space Grotesk';font-size:18px}
  .sched{width:100%;border-collapse:collapse;font-size:13px}
  .sched th,.sched td{border:1px solid var(--line);padding:10px 11px;text-align:left}
  .sched th{color:var(--mut);font-weight:700;font-size:10.5px;text-transform:uppercase}
  .pillc{font-size:11px;padding:3px 9px;border-radius:999px;display:inline-block;font-weight:600}
  .scrim{position:fixed;inset:0;background:rgba(2,6,15,.66);backdrop-filter:blur(2px);display:none;z-index:40}
  .scrim.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:470px;max-width:94vw;background:var(--card);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:.22s;overflow:auto}
  .drawer.show{transform:none}
  .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .dh b{font-family:'Space Grotesk';font-size:16px}
  .db{padding:18px 20px}
  .x{background:none;border:1px solid var(--line);color:var(--mut);border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:15px}
  .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.show{display:flex}
  .sheet{background:#fff;color:#16202b;width:580px;max-width:95vw;max-height:90vh;overflow:auto;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
  .lrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef1f5;font-size:14px}
  .mini{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}
  .mini .m{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px}
  .mini .m .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700}
  .mini .m .v{font-family:'Space Grotesk';font-weight:700;font-size:21px;margin-top:3px}
  @media(max-width:960px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}.board{grid-template-columns:1fr}.offers{grid-template-columns:1fr}.search{display:none}.badges .bdg span{display:none}}
</style>
</head>
<body>
<div class="topbar">
  <button class="menu">☰</button>
  <div class="brand"><div class="blogo">S</div><div><b>Skalora</b><small>CRM · ERP</small></div></div>
  <div class="badges">
    <span class="bdg red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>163 <span>Zadania</span></span>
    <span class="bdg red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>156 <span>Overdue</span></span>
    <span class="bdg amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>7 <span>Ryzyko</span></span>
    <span class="bdg orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>172 <span>Leady</span></span>
  </div>
  <div class="spacer"></div>
  <div class="search">🔍 Szukaj… <span style="opacity:.6;border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:10px">Ctrl+K</span></div>
  <div class="ico">🔔</div>
  <div class="ava"><div class="av">A</div><small>Admin</small></div>
</div>

<nav class="subnav" id="nav">
  <button data-tab="dashboard" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg> Dashboard</button>
  <button data-tab="pipeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="9" y2="18"/></svg> Pipeline</button>
  <button data-tab="klienci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg> Klienci</button>
  <button data-tab="realizacja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-8.5 8.5a2.12 2.12 0 1 1-3-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16 4.6a5.56 5.56 0 0 0-3.94-1.64H9l.92.82A6.18 6.18 0 0 1 12 8.4v1.56l2 2h.86c.85 0 1.65.33 2.25.93l1.25 1.25"/></svg> Realizacja</button>
  <button data-tab="oferty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/></svg> Oferty</button>
  <button data-tab="finansowanie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg> Finansowanie</button>
  <button data-tab="ekipy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg> Ekipy</button>
  <button data-tab="dokumenty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg> Dokumenty</button>
</nav>

<div class="wrap">
  <div class="pagehead">
    <h1 id="title">Dashboard</h1>
    <div class="acts">
      <button class="btn ghost">Ref link</button>
      <button class="btn green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nowy Lead</button>
      <button class="btn blue">Zadanie</button>
      <button class="btn violet">Spotkanie</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"><div class="dh"><b id="dTitle">Szczegóły</b><button class="x" id="dClose">✕</button></div><div class="db" id="dBody"></div></aside>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
var ICON={
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  cal:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  check:'<path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  userx:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" x2="22" y1="8" y2="13"/><line x1="22" x2="17" y1="8" y2="13"/>',
  msgoff:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h9"/><line x1="2" x2="22" y1="2" y2="22"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
