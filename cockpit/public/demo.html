<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skalora — CRM / ERP (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#040814;--card:#0e1626;--card2:#131f33;--muted:#16233c;--line:#23304a;--txt:#eef2f8;--mut:#93a1b8;
    --green:#10b981;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;--violet:#8b5cf6;--orange:#fb923c;--cyan:#22d3ee;--r:16px}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1100px 500px at 80% -10%,rgba(16,185,129,.08),transparent 60%),radial-gradient(900px 500px at 0% 0%,rgba(59,130,246,.06),transparent 55%),var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.head{font-family:'Space Grotesk','Plus Jakarta Sans',sans-serif}
  .topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(8,13,26,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .menu{width:34px;height:34px;border:1px solid var(--line);background:var(--muted);border-radius:10px;color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .brand{display:flex;align-items:center;gap:10px}
  .blogo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#22d3ee,#3b82f6 45%,#10b981);display:flex;align-items:center;justify-content:center;color:#04130d;font-weight:800;font-size:16px;box-shadow:0 4px 14px rgba(16,185,129,.3)}
  .brand b{font-size:15px;letter-spacing:.06em;font-family:'Space Grotesk'}
  .brand small{display:block;font-size:9px;color:var(--mut);letter-spacing:.22em;margin-top:1px}
  .badges{display:flex;gap:7px;flex-wrap:wrap;margin-left:8px}
  .bdg{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:5px 11px;font-size:12px;font-weight:700}
  .bdg svg{width:13px;height:13px}
  .bdg.red{background:rgba(239,68,68,.13);color:#f87171;border:1px solid rgba(239,68,68,.32)}
  .bdg.amber{background:rgba(245,158,11,.13);color:#fbbf24;border:1px solid rgba(245,158,11,.32)}
  .bdg.orange{background:rgba(251,146,60,.13);color:#fdba74;border:1px solid rgba(251,146,60,.32)}
  .spacer{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mut);font-size:12.5px;min-width:170px}
  .ico{width:34px;height:34px;border:1px solid var(--line);background:var(--muted);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
  .ava{display:flex;align-items:center;gap:8px}
  .ava .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#10b981);display:flex;align-items:center;justify-content:center;color:#04130d;font-weight:800;font-size:12px}
  .ava small{font-size:11px;color:var(--mut)}
  .subnav{display:flex;gap:2px;padding:0 16px;background:rgba(8,13,26,.6);border-bottom:1px solid var(--line);position:sticky;top:55px;z-index:25;overflow-x:auto}
  .subnav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:13px 13px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .subnav button svg{width:16px;height:16px}
  .subnav button:hover{color:var(--txt)}
  .subnav button.on{color:#fff;border-bottom-color:var(--green)}
  .subnav button.on svg{color:var(--green)}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 24px 56px}
  .pagehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .pagehead h1{margin:0;font-size:25px;font-weight:700}
  .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:11px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;color:#fff;transition:.14s}
  .btn:hover{filter:brightness(1.08)}
  .btn svg{width:15px;height:15px}
  .btn.green{background:linear-gradient(135deg,#10b981,#059669);color:#04130d}
  .btn.blue{background:var(--blue)} .btn.violet{background:var(--violet)}
  .btn.ghost{background:var(--muted);color:var(--txt);border:1px solid var(--line)}
  .muted{color:var(--mut)}
  .sec{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:800;margin:26px 2px 11px;display:flex;align-items:center;gap:8px}
  .sec svg{width:15px;height:15px;color:var(--green)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .today{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;background:linear-gradient(135deg,rgba(16,185,129,.07),rgba(59,130,246,.05)),var(--card)}
  .today .l small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:800}
  .today .l p{margin:6px 0 0;font-size:13px;color:var(--mut)}
  .today a{color:var(--green);font-size:13px;text-decoration:none;font-weight:600;white-space:nowrap}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .filters .f{font-size:12px;border:1px solid var(--line);background:var(--muted);color:var(--mut);border-radius:9px;padding:6px 11px;cursor:pointer;font-weight:600}
  .filters .f.on{background:rgba(16,185,129,.15);color:#bff3df;border-color:rgba(16,185,129,.4)}
  .tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  table.t{width:100%;border-collapse:collapse;font-size:12.5px}
  table.t thead{background:var(--muted)}
  table.t th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;padding:11px 10px;text-align:right}
  table.t th.l,table.t td.l{text-align:left}
  table.t td{padding:12px 10px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  table.t tr.click{cursor:pointer}
  table.t tr.click:hover{background:rgba(255,255,255,.03)}
  .uname{font-weight:700;color:var(--txt)}.role{color:var(--mut)}
  .score{font-weight:800;color:var(--green);font-family:'Space Grotesk'}
  .st{font-size:10px;padding:3px 9px;border-radius:999px;border:1px solid;font-weight:700;white-space:nowrap}
  .st.act{border-color:rgba(16,185,129,.4);color:#6ee7b7}.st.over{border-color:rgba(245,158,11,.4);color:#fcd34d}
  .st.no{border-color:var(--line);color:var(--mut)}.st.blue{border-color:rgba(59,130,246,.4);color:#93c5fd}
  tr.inactive{opacity:.5}
  .grid{display:grid;gap:11px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
  .kpi{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;transition:.14s}
  .kpi:hover{transform:translateY(-2px)}
  .kpi .kh{display:flex;align-items:center;gap:7px;margin-bottom:8px}.kpi .kh svg{width:16px;height:16px}
  .kpi .kl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700}
  .kpi .kv{font-family:'Space Grotesk';font-weight:700;font-size:31px;line-height:1}
  .kpi.red{border-color:var(--red);background:linear-gradient(180deg,rgba(239,68,68,.08),transparent);box-shadow:0 10px 26px rgba(239,68,68,.13)} .kpi.red .kv,.kpi.red svg{color:#f87171}
  .kpi.amber{border-color:var(--amber);background:linear-gradient(180deg,rgba(245,158,11,.08),transparent);box-shadow:0 10px 26px rgba(245,158,11,.12)} .kpi.amber .kv,.kpi.amber svg{color:#fbbf24}
  .kpi.green{box-shadow:0 10px 26px rgba(16,185,129,.10)} .kpi.green .kv,.kpi.green svg{color:var(--green)}
  .kpi.blue .kv,.kpi.blue svg{color:#60a5fa}.kpi.violet .kv,.kpi.violet svg{color:#a78bfa}.kpi.neutral .kv{color:var(--txt)} .kpi.neutral svg{color:var(--mut)}
  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;align-items:start}
  .col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:120px}
  .col h3{font-size:11px;margin:4px 6px 10px;color:var(--mut);display:flex;justify-content:space-between;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .col h3 .cnt{background:var(--muted);border-radius:999px;padding:1px 8px;color:var(--txt)}
  .lead{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:8px;cursor:pointer;transition:.12s}
  .lead:hover{border-color:var(--green);transform:translateY(-1px)}
  .lead .nm{font-weight:700;font-size:13px}.lead .mt{font-size:11px;color:var(--mut);margin-top:5px;display:flex;justify-content:space-between}.lead .mt b{color:var(--green);font-weight:700}
  .stage{display:flex;gap:14px;cursor:pointer}.stage .rail{display:flex;flex-direction:column;align-items:center}
  .stage .node{width:27px;height:27px;border-radius:50%;border:2px solid var(--line);background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut);font-weight:700}
  .stage .line{width:2px;flex:1;background:var(--line);min-height:24px}
  .stage.done .node{background:var(--green);border-color:var(--green);color:#04130d}
  .stage.active .node{background:#0a1120;border-color:var(--green);color:var(--green);box-shadow:0 0 0 4px rgba(16,185,129,.2)}
  .stage .body{padding-bottom:20px}.stage .ttl{font-weight:700}.stage:hover .ttl{color:var(--green)}.stage .sub{font-size:12px;color:var(--mut);margin-top:2px}
  .progress{height:9px;background:var(--muted);border-radius:999px;overflow:hidden;margin-top:10px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#10b981)}
  .offers{grid-template-columns:repeat(3,1fr)}
  .offer{cursor:pointer;transition:.12s;padding:0;overflow:hidden}.offer:hover{border-color:var(--green);transform:translateY(-3px)}
  .offer .ph{height:140px;background:linear-gradient(135deg,#0c2a22,#123a4d);border-bottom:1px solid var(--line)}
  .offer .ob{padding:15px}.offer .nm{font-weight:700;font-family:'Space Grotesk'}.offer .pr{color:var(--green);font-weight:800;margin-top:6px;font-family:'Space Grotesk';font-size:18px}
  .sched{width:100%;border-collapse:collapse;font-size:13px}.sched th,.sched td{border:1px solid var(--line);padding:10px 11px;text-align:left}.sched th{color:var(--mut);font-weight:700;font-size:10.5px;text-transform:uppercase}
  .pillc{font-size:11px;padding:3px 9px;border-radius:999px;display:inline-block;font-weight:600}
  /* calendar */
  .calgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .calcol{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px;min-height:230px}
  .calcol h4{margin:2px 4px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);display:flex;justify-content:space-between}
  .mtg{background:var(--card2);border:1px solid var(--line);border-left-width:3px;border-radius:9px;padding:8px 9px;margin-bottom:7px;font-size:12px;cursor:pointer;transition:.12s}
  .mtg:hover{transform:translateY(-1px);border-color:var(--green)}
  .mtg b{display:block;color:var(--green);font-family:'Space Grotesk';font-size:12px}
  .mtg .who{font-size:10.5px;color:var(--mut);margin-top:3px}
  /* lead card */
  .lc-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .lc-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .panel-now{border:1px solid rgba(245,158,11,.4)!important;background:linear-gradient(180deg,rgba(245,158,11,.07),transparent),var(--card)!important}
  .nowbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .note{border-left:2px solid var(--line);padding:0 0 14px 13px;margin-left:3px}
  .note .tg{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
  .note .tx{font-weight:600;margin-top:2px;font-size:13px}.note .tm{font-size:11px;color:var(--mut);margin-top:1px}
  /* scrim/drawer/modal */
  .scrim{position:fixed;inset:0;background:rgba(2,6,15,.66);backdrop-filter:blur(2px);display:none;z-index:40}.scrim.show{display:block}
  .sidemenu{position:fixed;top:0;left:-300px;width:264px;height:100vh;background:var(--card);border-right:1px solid var(--line);z-index:60;transition:.22s;padding:16px 12px;overflow:auto}.sidemenu.show{left:0}
  .sidemenu .smhead{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
  #smnav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:11px 12px;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600}
  #smnav button svg{width:18px;height:18px}#smnav button:hover{background:var(--muted);color:var(--txt)}#smnav button.on{background:rgba(16,185,129,.12);color:#d6f7ea}#smnav button.on svg{color:var(--green)}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:470px;max-width:94vw;background:var(--card);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:.22s;overflow:auto}.drawer.show{transform:none}
  .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dh b{font-family:'Space Grotesk';font-size:16px}.db{padding:18px 20px}
  .x{background:none;border:1px solid var(--line);color:var(--mut);border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:15px}
  .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}.row b{text-align:right}
  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}
  .sheet{background:#fff;color:#16202b;width:620px;max-width:96vw;max-height:92vh;overflow:auto;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
  .lrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef1f5;font-size:14px}
  .qt{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
  .qt td{padding:9px 4px;border-bottom:1px solid #eef1f5}.qt td:last-child{text-align:right;font-weight:700}
  .qt tr.sum td{border-top:2px solid #16202b;border-bottom:0;font-size:17px;font-weight:800;padding-top:12px}
  .mini{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}
  .mini .m{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px}.mini .m .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700}.mini .m .v{font-family:'Space Grotesk';font-weight:700;font-size:21px;margin-top:3px}
  @media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}.board{grid-template-columns:1fr}.offers{grid-template-columns:1fr}.calgrid{grid-template-columns:1fr}.search{display:none}.badges .bdg span{display:none}.nowbtns{grid-template-columns:repeat(2,1fr)}.lc-cols{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<div class="topbar">
  <button class="menu" id="burger">☰</button>
  <div class="brand"><div class="blogo">S</div><div><b>Skalora</b><small>CRM · ERP</small></div></div>
  <div class="badges">
    <span class="bdg red">163 <span>Zadania</span></span>
    <span class="bdg red">156 <span>Overdue</span></span>
    <span class="bdg amber">7 <span>Ryzyko</span></span>
    <span class="bdg orange">172 <span>Leady</span></span>
  </div>
  <div class="spacer"></div>
  <div class="search">🔍 Szukaj… <span style="opacity:.6;border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:10px">Ctrl+K</span></div>
  <div class="ico">🔔</div>
  <div class="ava"><div class="av">A</div><small>Admin</small></div>
</div>

<nav class="subnav" id="nav">
  <button data-tab="dashboard" class="on">▦ Dashboard</button>
  <button data-tab="leady">≣ Leady</button>
  <button data-tab="klienci">☺ Klienci</button>
  <button data-tab="kalendarz">▤ Kalendarz</button>
  <button data-tab="realizacja">⚒ Realizacja</button>
  <button data-tab="oferty">▢ Oferty</button>
  <button data-tab="finansowanie">▤ Finansowanie</button>
  <button data-tab="newsletter">✉ Newsletter</button>
  <button data-tab="ekipy">☺ Ekipy</button>
  <button data-tab="dokumenty">▭ Dokumenty</button>
</nav>

<div class="wrap">
  <div class="pagehead">
    <h1 id="title">Dashboard</h1>
    <div class="acts">
      <button class="btn ghost">Ref link</button>
      <button class="btn green">+ Nowy Lead</button>
      <button class="btn blue">Zadanie</button>
      <button class="btn violet">Spotkanie</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sidemenu" id="sidemenu"><div class="smhead"><div class="blogo">S</div><div><b style="font-family:Space Grotesk">Skalora</b><div style="font-size:9px;color:var(--mut);letter-spacing:.2em">CRM · ERP</div></div></div><div id="smnav"></div></aside>
<aside class="drawer" id="drawer"><div class="dh"><b id="dTitle">Szczegóły</b><button class="x" id="dClose">✕</button></div><div class="db" id="dBody"></div></aside>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
function svg(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;color:var(--green);vertical-align:-2px">'+p+'</svg>';}
function houseSVG(){return '<svg viewBox="0 0 240 140" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display:block">'+
 '<circle cx="198" cy="34" r="11" fill="rgba(245,158,11,.22)" stroke="#fbbf24" stroke-width="1.5"/>'+
 '<line x1="22" y1="116" x2="218" y2="116" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/>'+
 '<polygon points="58,64 120,28 182,64" fill="rgba(16,185,129,.20)" stroke="#7fe3bf" stroke-width="2" stroke-linejoin="round"/>'+
 '<rect x="72" y="64" width="96" height="52" fill="rgba(255,255,255,.07)" stroke="#7fe3bf" stroke-width="2"/>'+
 '<rect x="112" y="88" width="17" height="28" fill="rgba(255,255,255,.10)" stroke="#7fe3bf" stroke-width="1.5"/>'+
 '<rect x="83" y="74" width="17" height="15" fill="rgba(34,211,238,.18)" stroke="#7fe3bf" stroke-width="1.3"/>'+
 '<rect x="140" y="74" width="17" height="15" fill="rgba(34,211,238,.18)" stroke="#7fe3bf" stroke-width="1.3"/>'+
 '<rect x="176" y="92" width="26" height="24" fill="rgba(16,185,129,.10)" stroke="#7fe3bf" stroke-width="1.3"/></svg>';}
function houseSVGlight(){return '<svg viewBox="0 0 240 150" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display:block">'+
 '<rect width="240" height="150" fill="#eaf4f1"/><circle cx="200" cy="34" r="13" fill="#fde68a"/>'+
 '<line x1="20" y1="122" x2="220" y2="122" stroke="#9fc4b6" stroke-width="2"/>'+
 '<polygon points="54,66 120,26 186,66" fill="#10b981" opacity=".85"/>'+
 '<rect x="70" y="66" width="100" height="56" fill="#ffffff" stroke="#10b981" stroke-width="2"/>'+
 '<rect x="112" y="92" width="18" height="30" fill="#cdeee2" stroke="#10b981" stroke-width="1.5"/>'+
 '<rect x="82" y="76" width="18" height="16" fill="#bfe6f7" stroke="#10b981" stroke-width="1.3"/>'+
 '<rect x="140" y="76" width="18" height="16" fill="#bfe6f7" stroke="#10b981" stroke-width="1.3"/>'+
 '<rect x="176" y="96" width="28" height="26" fill="#e6f6ef" stroke="#10b981" stroke-width="1.3"/></svg>';}
// bogatsza wizualizacja domu (3 warianty: Aurora/Solaris/Nordica) z niebem i trawą
function houseArt(model){
  var k=model&&model.indexOf("Solaris")>=0?"s":(model&&model.indexOf("Nordica")>=0?"n":"a");
  var roof="#0ea371";

  h+='<div><h2 style="margin:0;color:var(--green);font-family:Space Grotesk">'+o.n+'</h2><div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap">'+badge("blue",stage)+badge("no","Indywidualny")+badge("no","excel_import")+'</div></div>';
  h+='<div class="lc-actions"><button class="btn green" onclick="leadAct(\'call\')">📞 Zadzwoń</button><button class="btn ghost" onclick="toast(\'✉ Wiadomość wysłana (demo)\')">✉ Wiadomość</button><button class="btn ghost" onclick="toast(\'📎 Materiały wysłane\')">Materiały</button><button class="btn ghost" onclick="go(\'finansowanie\')">Finansowanie</button></div></div>';
  h+='<div class="card panel-now" style="margin-top:14px"><div style="display:flex;justify-content:space-between"><small style="color:#fbbf24;font-weight:800;letter-spacing:.12em;font-size:11px">CO TERAZ?</small>'+badge("over","Dziś")+'</div>';
  h+='<div style="font-size:19px;font-weight:700;margin-top:9px;font-family:Space Grotesk">Oddzwonić</div><div class="muted" style="font-size:13px;margin-top:3px">⏰ sob., 27.06.2026, 10:00</div>';
  h+='<div class="nowbtns"><button class="btn green" style="justify-content:center" onclick="leadAct(\'call\')">📞 Zadzwoń</button><button class="btn ghost" style="justify-content:center;color:#fbbf24" onclick="leadAct(\'noans\')">Nie odebrał</button><button class="btn ghost" style="justify-content:center;color:#f87171" onclick="leadAct(\'lost\')">Nie zainteresowany</button><button class="btn ghost" style="justify-content:center" onclick="leadAct(\'edit\')">✎ Zmień</button></div></div>';
  h+='<div class="filters" style="margin-top:16px">'+tabbtn("dane","Dane")+tabbtn("zadania","Zadania")+tabbtn("spotkania","Spotkania")+tabbtn("historia","Historia")+tabbtn("oferty","Oferty")+tabbtn("dokumenty","Dokumenty")+'</div>';
  h+='<div class="lc-cols" style="display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:4px"><div>'+leadTab(o)+'</div><div>';
  h+='<div class="card"><div class="sec" style="margin:0 0 8px">Zespół</div>'+rowKV("Handlowiec",o.hh||"Handlowiec A.")+rowKV("Call Center","Nieprzypisany")+'</div>';
  h+='<div class="card" style="margin-top:12px"><div class="sec" style="margin:0 0 10px">Ostatnie zdarzenia</div>';
  for(var i=0;i<Math.min(3,cardHist.length);i++)h+=note(cardHist[i].tg,cardHist[i].tx,cardHist[i].tm);
  h+='</div></div></div>';
  return h;
}
function renderCard(){var o=findLead(cardId);el("content").innerHTML=viewLeadCard(cardId);el("title").textContent=o?o.n:"Karta";setActive("leady");}
function setLeadTab(t){cardTab=t;renderCard();}
function toggleTask(i){cardTasks[i].done=!cardTasks[i].done;renderCard();toast(cardTasks[i].done?"✓ Zadanie odhaczone":"Zadanie wznowione");}
function addTask(){cardTasks.push({t:"Nowe zadanie",due:"termin: dziś",done:false});renderCard();toast("➕ Dodano zadanie");}
function leadAct(a){
  var now="27.06.2026, "+(10+Math.floor(cardHist.length))%24+":0"+(cardHist.length%6);
  if(a==="call"){cardHist.unshift({tg:"Rozmowa telefoniczna",tx:"Połączenie wykonane — klient zainteresowany, umówiono prezentację",tm:now});toast("📞 Rozmowa zapisana w historii");}
  else if(a==="noans"){cardHist.unshift({tg:"Zdarzenie · system",tx:"Nie odebrał — zaplanowano ponowną próbę jutro",tm:now});toast("Zapisano: nie odebrał");}
  else if(a==="lost"){cardHist.unshift({tg:"Status",tx:"Oznaczono jako: niezainteresowany",tm:now});toast("Lead oznaczony jako niezainteresowany");}
  else{toast("✎ Edycja następnego kroku (demo)");return;}
  renderCard();
}

function mcard(l,v){return '<div class="m"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';}
function openMember(i){var t=team[i];
  if(t.st==="no"){drawer(t.name,'<div class="muted" style="font-size:13px">'+t.role+'</div><div class="card" style="margin-top:14px;text-align:center;color:var(--mut)">Brak zarejestrowanej aktywności w dzisiejszym oknie.</div><button class="btn ghost" style="margin-top:12px;width:100%;justify-content:center" onclick="closeAll()">Zamknij</button>');return;}
  var h='<div class="muted" style="font-size:13px">'+t.role+' · Wynik dnia: <b style="color:var(--green)">'+t.score+'</b></div>';
  h+='<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);font-weight:800;margin:16px 0 2px">Aktywność wykonana</div><div class="mini">'+mcard("Telefony wykonane",t.tel)+mcard("Skuteczne kontakty",t.skut)+mcard("Dalsze czynności",t.dalsze)+mcard("Oferty wysłane",t.of)+mcard("Spotkania umówione",t.sp)+mcard("Statusy zmienione",t.stat)+'</div>';
  h+='<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#a78bfa;font-weight:800;margin:16px 0 2px">Przepływ leadów</div><div class="mini">'+mcard("Przydzielone (okres)",t.przydz)+mcard("Notatki",t.not)+'</div>';
  h+='<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fbbf24;font-weight:800;margin:16px 0 2px">Zaległe</div><div class="mini">'+mcard("Zadania zaległe",t.zal)+mcard("Telefony zaległe",t.zal)+'</div>';
  h+='<button class="btn ghost" style="margin-top:16px;width:100%;justify-content:center" onclick="closeAll()">Zamknij</button>';
  drawer(t.name,h);
}

el("nav").addEventListener("click",function(e){var b=e.target.closest("button");if(b)go(b.getAttribute("data-tab"));});
el("smnav").addEventListener("click",function(e){var b=e.target.closest("button");if(b)go(b.getAttribute("data-tab"));});
el("burger").addEventListener("click",function(){el("sidemenu").classList.contains("show")?closeAll():openMenu();});
el("scrim").addEventListener("click",closeAll);
el("dClose").addEventListener("click",closeAll);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeAll()});
go("dashboard");
</script>
</body>
</html>
