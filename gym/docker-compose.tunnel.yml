# Dokłada tunel Cloudflare do działającego openGym (WEB_PORT, domyślnie 8080).
# network_mode: host działa na Linuksie (VPS, Oracle Free, mini-PC) i nie wymaga
# znajomości nazw usług z compose openGym. Tunel ma Public Hostname:
#   gym.skalora.pl -> http://localhost:8080
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    network_mode: host
    restart: unless-stopped
